server:
  port: 8081

spring:
  application:
    name: campusnest
  # Lee las claves privadas del archivo .env (NO se sube a GitHub; ver .env.example)
  config:
    import: optional:file:.env[.properties]
  # US 24+: agente de IA (Spring AI). Groq expone una API compatible con OpenAI.
  ai:
    openai:
      api-key: ${GROQ_API_KEY:no-configurada}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: openai/gpt-oss-120b
          temperature: 0.2
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always   # crea la tabla de memoria si no existe
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campusnest}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:adminadmin}
    #password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: true

# Seguridad (semana 6): la clave real va en variable de entorno, NO en GitHub.
jwt:
  secret: ${JWT_SECRET:clave-solo-para-desarrollo-campusnest-256-bits-minimo!!}
  expiration-ms: 86400000   # 24 h

# US 09: dominios de correo universitario aceptados (editar según el equipo).
app:
  institutional-domains: upc.edu.pe,pucp.edu.pe,uni.pe,unmsm.edu.pe,ulima.edu.pe,up.edu.pe,usil.edu.pe,usmp.pe,utp.edu.pe

# US 01: linea base de convivencia ideal (escala 1-5) contra la que se calcula el % de compatibilidad.
  match:
    ideal-cleanliness: 4
    ideal-noise: 2
